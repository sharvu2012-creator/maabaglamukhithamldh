<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserve Your Seat — Thursday Beej Mala</title>
<meta name="description" content="Book your seat for the Thursday Beej Mala at Maa Baglamukhi Dham, Ludhiana. Secure online booking with UPI payment.">
<meta name="theme-color" content="#5A1E1E">

<meta property="og:type" content="website">
<meta property="og:title" content="Reserve Your Seat — Thursday Beej Mala">
<meta property="og:description" content="Book your seat for the sacred weekly Beej Mala at Maa Baglamukhi Dham, Ludhiana.">
<meta property="og:url" content="https://maabaglamukhithamldh.netlify.app/booking-flow">
<meta property="og:image" content="https://maabaglamukhithamldh.netlify.app/images/IMG_3926.JPG">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%235A1E1E'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23D4AF37'%3E卐%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===================================================================
     DESIGN TOKENS — copied verbatim from beej-mala-booking.html
     so the booking flow stays visually identical to the main site.
     =================================================================== */
  :root{
    --gold: #D4AF37;
    --gold-soft: #e3c766;
    --saffron: #E6A100;
    --ivory: #FFFDF8;
    --ivory-dim: #FBF6EA;
    --maroon: #5A1E1E;
    --maroon-deep: #3E1414;
    --temple-yellow: #FFD54F;
    --charcoal: #222222;
    --charcoal-soft: #4a4440;
    --line: rgba(90,30,30,0.12);
    --radius: 18px;
    --shadow-soft: 0 20px 60px -25px rgba(90,30,30,0.35);
    --shadow-card: 0 12px 40px -20px rgba(90,30,30,0.25);
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Manrope', -apple-system, sans-serif;

    --green: #3d7a4d;
    --amber: #b5680a;
    --red: #a5342a;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  body{ font-family: var(--sans); color: var(--charcoal); background: var(--ivory-dim); line-height:1.6; padding-bottom: 90px; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  ul{ list-style:none; }
  img{ max-width:100%; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }

  .container{ max-width: 1080px; margin:0 auto; padding: 0 20px; }

  .eyebrow{
    font-size:0.7rem; letter-spacing:0.24em; text-transform:uppercase;
    color: var(--saffron); font-weight:700; display:inline-flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:""; width:22px; height:1px; background:var(--saffron); }

  h1,h2,h3{ font-family:var(--serif); color:var(--maroon); font-weight:600; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:15px 30px; border-radius:999px; border:none; font-size:0.94rem; font-weight:600;
    transition: transform .3s ease, box-shadow .3s ease, background .3s ease, opacity .3s ease;
  }
  .btn-primary{ background: linear-gradient(135deg, var(--gold), var(--saffron)); color: var(--maroon-deep); box-shadow: 0 12px 26px -12px rgba(212,175,55,0.55); }
  .btn-primary:hover:not(:disabled){ transform: translateY(-2px); }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
  .btn-outline{ background: transparent; color: var(--maroon); border: 1.4px solid var(--line); }
  .btn-outline:hover{ border-color: var(--gold); }
  .btn-text{ background:none; color: var(--saffron); font-weight:700; padding: 8px 4px; }
  .btn-block{ width:100%; }
  .btn-sm{ padding: 10px 18px; font-size:0.82rem; }

  /* ===================== TOP BAR ===================== */
  .topbar{
    background: var(--maroon); color: var(--ivory);
    padding: 18px 0;
  }
  .topbar .container{ display:flex; align-items:center; justify-content:space-between; }
  .topbar .brand{ font-family:var(--serif); font-size:1.15rem; display:flex; align-items:center; gap:10px; }
  .topbar .brand-mark{ width:30px;height:30px;border-radius:50%; border:1.2px solid var(--gold); display:flex; align-items:center; justify-content:center; color:var(--gold); font-size:0.9rem; }
  .topbar .back-link{ font-size:0.82rem; color: rgba(255,253,248,0.75); display:flex; align-items:center; gap:6px; }
  .topbar .back-link:hover{ color: var(--temple-yellow); }

  /* ===================== PROGRESS ===================== */
  .progress-wrap{ background: var(--ivory); border-bottom:1px solid var(--line); padding: 18px 0; position:sticky; top:0; z-index:50; }
  .progress{ display:flex; align-items:center; gap: 6px; }
  .p-step{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:0.68rem; color: var(--charcoal-soft); text-align:center; }
  .p-dot{ width:26px;height:26px;border-radius:50%; background: var(--ivory-dim); border:1.4px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; color:var(--charcoal-soft); transition: all .35s ease; }
  .p-step.done .p-dot{ background: var(--gold); border-color:var(--gold); color: var(--maroon-deep); }
  .p-step.active .p-dot{ background: var(--maroon); border-color:var(--maroon); color: var(--ivory); box-shadow: 0 0 0 5px rgba(90,30,30,0.1); }
  .p-step.active .p-label{ color: var(--maroon); font-weight:700; }
  .p-line{ flex:1; height:2px; background: var(--line); margin-top:-20px; }
  .p-line.done{ background: var(--gold); }
  .p-label{ display:none; }
  @media(min-width:640px){ .p-label{ display:block; } }

  /* ===================== LAYOUT ===================== */
  .flow-main{ padding: 34px 0 60px; }
  .grid-2{ display:grid; gap: 28px; }
  @media(min-width:960px){ .grid-2{ grid-template-columns: 1.5fr 1fr; align-items:start; } }

  .card{
    background: var(--ivory); border:1px solid var(--line); border-radius: var(--radius);
    padding: 30px; box-shadow: var(--shadow-card);
  }
  .card + .card{ margin-top:22px; }
  .card h2{ font-size:1.5rem; margin-bottom:6px; }
  .card .sub{ font-size:0.88rem; color: var(--charcoal-soft); margin-bottom: 22px; }

  /* ===================== SESSION SNAPSHOT ===================== */
  .snap-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap: 16px 22px; margin-bottom:20px; }
  @media(min-width:480px){ .snap-grid{ grid-template-columns: repeat(4,1fr); } }
  .snap-item .l{ font-size:0.66rem; letter-spacing:0.1em; text-transform:uppercase; color: rgba(34,34,34,0.45); margin-bottom:4px; }
  .snap-item .v{ font-family:var(--serif); font-size:1.15rem; color:var(--maroon); }

  /* ===================== SEAT AVAILABILITY (reusable) ===================== */
  .seat-avail{ margin-bottom: 22px; }
  .seat-avail-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; flex-wrap:wrap; gap:6px; }
  .seat-avail-top .count{ font-family:var(--serif); font-size:1.05rem; color:var(--maroon); }
  .status-tag{ display:inline-flex; align-items:center; gap:6px; font-size:0.76rem; font-weight:700; padding:5px 12px; border-radius:999px; }
  .status-tag.open{ background: rgba(61,122,77,0.1); color: var(--green); }
  .status-tag.filling{ background: rgba(230,161,0,0.12); color: var(--saffron); }
  .status-tag.almost{ background: rgba(181,104,10,0.14); color: var(--amber); }
  .status-tag.full, .status-tag.closed{ background: rgba(165,52,42,0.1); color: var(--red); }
  .status-tag .dot{ width:6px;height:6px;border-radius:50%; background:currentColor; }
  .bar-track{ height:8px; border-radius:999px; background: var(--ivory-dim); border:1px solid var(--line); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:999px; background: linear-gradient(90deg, var(--gold), var(--saffron)); transition: width .6s ease; }
  .seat-updated{ font-size:0.72rem; color: rgba(34,34,34,0.4); margin-top:8px; }
  .seat-breakdown{ font-size:0.74rem; color: rgba(34,34,34,0.5); margin-top:10px; }

  /* ===================== PARTICIPANT SELECTOR ===================== */
  .qty-row{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; background: var(--ivory-dim); border-radius:14px; border:1px solid var(--line); margin-bottom:20px; }
  .qty-row .qty-label{ font-weight:600; font-size:0.94rem; }
  .qty-row .qty-hint{ font-size:0.78rem; color: var(--charcoal-soft); margin-top:2px; }
  .stepper{ display:flex; align-items:center; gap:14px; }
  .stepper button{ width:38px;height:38px;border-radius:50%; border:1.4px solid var(--gold); background:var(--ivory); color:var(--maroon); font-size:1.1rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .stepper button:disabled{ opacity:0.35; cursor:not-allowed; }
  .stepper .qty-value{ font-family:var(--serif); font-size:1.4rem; min-width: 28px; text-align:center; }

  .notice{
    display:flex; gap:12px; padding: 16px 18px; border-radius:14px;
    background: rgba(212,175,55,0.08); border:1px solid rgba(212,175,55,0.3);
    font-size:0.86rem; color: var(--charcoal-soft); margin-bottom: 22px;
  }
  .notice.warn{ background: rgba(181,104,10,0.08); border-color: rgba(181,104,10,0.3); }
  .notice.error{ background: rgba(165,52,42,0.08); border-color: rgba(165,52,42,0.3); color: var(--red); }
  .notice.success{ background: rgba(61,122,77,0.08); border-color: rgba(61,122,77,0.3); }
  .notice .ic{ flex-shrink:0; }

  /* ===================== FORMS ===================== */
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:0.78rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; color: var(--charcoal-soft); margin-bottom:7px; }
  .field input, .field select{
    width:100%; padding:14px 16px; border-radius:12px; border:1px solid rgba(90,30,30,0.18);
    background: var(--ivory); font-family:var(--sans); font-size:0.95rem; color:var(--charcoal);
  }
  .field input:focus, .field select:focus{ border-color: var(--gold); box-shadow: 0 0 0 4px rgba(212,175,55,0.14); outline:none; }
  .field.has-error input{ border-color: var(--red); }
  .field .err{ color: var(--red); font-size:0.78rem; margin-top:6px; display:none; }
  .field.has-error .err{ display:block; }
  .form-row-2{ display:grid; gap:16px; }
  @media(min-width:560px){ .form-row-2{ grid-template-columns:1fr 1fr; } }

  .checkbox-row{ display:flex; align-items:flex-start; gap:10px; font-size:0.85rem; color:var(--charcoal-soft); margin-bottom:14px; }
  .checkbox-row input{ margin-top:3px; accent-color: var(--gold); width:16px;height:16px; flex-shrink:0; }

  .participant-block{ border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; background: var(--ivory-dim); position:relative; }
  .participant-block h3{ font-size:1.02rem; margin-bottom:14px; }
  .remove-participant{ position:absolute; top:14px; right:14px; font-size:0.74rem; color: var(--red); background:none; border:none; font-weight:700; }

  .dup-warning{ font-size:0.8rem; color: var(--amber); margin-top:-8px; margin-bottom:16px; }

  /* ===================== CONSENT ===================== */
  .consent-links{ display:flex; gap:16px; flex-wrap:wrap; font-size:0.82rem; margin: 4px 0 20px; }
  .consent-links button{ background:none; border:none; color: var(--saffron); font-weight:700; text-decoration:underline; }

  /* ===================== SUMMARY SIDEBAR ===================== */
  .summary-card{ position:sticky; top: 90px; }
  .summary-row{ display:flex; justify-content:space-between; font-size:0.88rem; padding:10px 0; border-bottom:1px dashed var(--line); }
  .summary-row .k{ color: var(--charcoal-soft); }
  .summary-row .v{ font-weight:600; }
  .summary-total{ display:flex; justify-content:space-between; align-items:baseline; padding-top:16px; margin-top:8px; }
  .summary-total .k{ font-family:var(--serif); font-size:1.05rem; color:var(--maroon); }
  .summary-total .v{ font-family:var(--serif); font-size:1.6rem; color:var(--maroon); }

  /* ===================== REVIEW ===================== */
  .review-section{ border-bottom:1px solid var(--line); padding: 18px 0; }
  .review-section:first-child{ padding-top:0; }
  .review-section:last-child{ border-bottom:none; padding-bottom:0; }
  .review-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .review-head h3{ font-size:1rem; }
  .review-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px 20px; font-size:0.9rem; }
  .review-grid .k{ color: rgba(34,34,34,0.5); font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; }
  .review-grid .v{ margin-top:2px; }

  /* ===================== PAYMENT (QR / manual UPI verification) ===================== */
  .qr-wrap{ text-align:center; margin: 22px 0 6px; }
  .qr-frame{
    display:inline-block; background:#ffffff; border-radius: var(--radius);
    padding:18px; border:1px solid var(--line); box-shadow: var(--shadow-card);
  }
  .qr-frame img{ width:100%; max-width:260px; height:auto; display:block; border-radius:10px; }
  .qr-caption{ margin-top:14px; font-size:0.88rem; color: var(--charcoal-soft); font-weight:600; }

  .pay-instructions{
    list-style:none; counter-reset:step; display:grid; gap:14px;
    margin: 24px 0 20px; padding:0;
  }
  .pay-instructions li{
    display:flex; gap:14px; align-items:flex-start;
    font-size:0.9rem; color: var(--charcoal-soft);
  }
  .pay-instructions li::before{
    counter-increment:step; content:counter(step);
    flex-shrink:0; width:26px; height:26px; border-radius:50%;
    background: var(--maroon); color: var(--ivory);
    font-size:0.76rem; font-weight:700; font-family:var(--serif);
    display:flex; align-items:center; justify-content:center;
  }

  .file-field{ margin-bottom:18px; }
  .file-field label{ display:block; font-size:0.78rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; color: var(--charcoal-soft); margin-bottom:7px; }
  .file-field input[type="file"]{
    width:100%; padding:12px 14px; border-radius:12px;
    border:1px dashed rgba(90,30,30,0.32); background: var(--ivory-dim);
    font-size:0.84rem; color: var(--charcoal);
  }
  .file-name-preview{ font-size:0.8rem; color: var(--charcoal-soft); margin-top:8px; }


  .hold-banner{ display:flex; align-items:center; justify-content:space-between; gap:14px; background: var(--maroon); color: var(--ivory); border-radius:14px; padding:16px 20px; margin-bottom:24px; flex-wrap:wrap; }
  .hold-banner .txt{ font-size:0.86rem; max-width: 340px; }
  .hold-timer{ font-family: var(--serif); font-size:1.5rem; color: var(--temple-yellow); }

  /* ===================== PROCESSING ===================== */
  .processing-wrap{ text-align:center; padding: 60px 20px; }
  .spinner{ width:56px;height:56px; border-radius:50%; border:3px solid rgba(212,175,55,0.25); border-top-color: var(--gold); margin:0 auto 26px; animation: spin 1s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .processing-wrap h2{ margin-bottom:10px; }
  .processing-wrap p{ color: var(--charcoal-soft); max-width:420px; margin:0 auto 26px; font-size:0.94rem; }

  /* ===================== CONFIRMATION ===================== */
  .confirm-hero{ text-align:center; padding: 20px 0 34px; }
  .confirm-hero .mark{ font-size:2.6rem; margin-bottom:10px; }
  .confirm-hero h1{ font-size: clamp(1.8rem,4vw,2.4rem); }
  .confirm-hero p{ color: var(--charcoal-soft); margin-top:8px; }
  .mock-tag{ display:inline-block; margin-top:14px; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; color: var(--charcoal-soft); background: var(--ivory-dim); border:1px solid var(--line); padding:5px 12px; border-radius:999px; }
  .confirm-actions{ display:flex; gap:12px; flex-wrap:wrap; margin-top: 26px; }

  /* ===================== FULL / CLOSED ===================== */
  .state-wrap{ text-align:center; padding: 70px 20px; max-width:560px; margin:0 auto; }
  .state-wrap .glyph{ font-size:2.4rem; margin-bottom:18px; }
  .state-wrap p{ color: var(--charcoal-soft); margin: 12px 0 26px; }

  /* ===================== MODAL ===================== */
  .modal-overlay{ position:fixed; inset:0; background: rgba(20,6,6,0.55); z-index:900; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal{ background: var(--ivory); border-radius: var(--radius); max-width:640px; width:100%; max-height:80vh; overflow:auto; padding:34px; box-shadow: var(--shadow-soft); }
  .modal-tabs{ display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .modal-tabs button{ padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--ivory-dim); font-size:0.8rem; font-weight:600; color: var(--charcoal-soft); }
  .modal-tabs button.active{ background: var(--maroon); color: var(--ivory); border-color: var(--maroon); }
  .modal p{ font-size:0.9rem; color: var(--charcoal-soft); margin-bottom:12px; }
  .modal-close{ float:right; font-size:1.3rem; background:none; border:none; color: var(--charcoal-soft); }

  /* ===================== STICKY MOBILE BAR ===================== */
  .sticky-bar{
    position: fixed; left:0; right:0; bottom:0; z-index:200;
    background: rgba(255,253,248,0.96); backdrop-filter: blur(10px);
    box-shadow: 0 -10px 26px -16px rgba(90,30,30,0.4);
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:14px;
  }
  .sticky-bar .amt{ flex:1; min-width:0; }
  .sticky-bar .amt .l{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color: var(--charcoal-soft); }
  .sticky-bar .amt .v{ font-family:var(--serif); font-size:1.25rem; color:var(--maroon); }
  @media(min-width:960px){ .sticky-bar{ display:none; } }

  .sr-only{ position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }

  @media(max-width:959px){ .summary-card-desktop{ display:none; } }

  /* === MOBILE & SCROLL FIXES === */
  html, body { overflow-x: hidden !important; max-width: 100vw !important; }
  @media (max-width: 768px) {
    .container { padding: 0 16px !important; }
    .booking-card { padding: 28px 20px !important; border-radius: 16px !important; }
    .btn { padding: 12px 24px !important; font-size: 0.88rem !important; }
    .btn-block { width: 100% !important; }
    .review-grid { grid-template-columns: 1fr !important; }
    .form-grid { grid-template-columns: 1fr !important; }
    .qr-frame img { max-width: 200px !important; }
    .section { padding: 40px 0 !important; }
    .step-indicator { flex-wrap: wrap !important; gap: 8px !important; }
    .step { padding: 8px 14px !important; font-size: 0.78rem !important; }
  }
  @media (max-width: 480px) {
    .booking-card { padding: 20px 14px !important; }
    .container { padding: 0 12px !important; }
  }
</style>
  <script type="module" crossorigin src="/assets/booking-bFAiHXB2.js"></script>

<div class="topbar">
  <div class="container">
    <a class="brand" href="/"><span class="brand-mark">卐</span>Maa Baglamukhi Dham</a>

  </div>
</div>
